name: tex-canonical

# The canonical TeX renderer acceptance needs canonical Linux/amd64, the sealed
# renderer image, and the pinned browser. It renders the five-profile corpus
# twice and requires byte-identical normalized SVG plus pixel-identical PNG and
# PDF Artifacts. Run it from the release procedure (docs/tex-renderer.md).
#
# On-demand only: the sealed v1 image predates the batch entrypoint the current
# compiler speaks, so a scheduled or pull-request trigger would fail until the
# renderer is re-released. A candidate image is checked on the release machine
# with `scripts/tex-canonical-verify.mjs --local --image <tag>`.
on:
  workflow_dispatch:

jobs:
  canonical:
    name: canonical TeX renderer (ubuntu 24.04 x64, node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # See ci.yml browser-smoke: Chrome's sandbox needs unprivileged user
      # namespaces on Ubuntu 24.04 runners; ephemeral host configuration.
      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run build --silent
      - name: Assert canonical architecture
        run: node -e "if (process.arch !== 'x64') throw new Error('Canonical evidence requires x64')"
      - name: Verify the canonical TeX projection
        run: node scripts/tex-canonical-verify.mjs --renderer-manifest release/tex-renderer-v1/tex-renderer-v1.manifest.json --output tex-canonical-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tex-canonical-report
          if-no-files-found: ignore
          path: tex-canonical-report.json
